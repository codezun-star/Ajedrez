<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- Brand mark (the knight alone: the full lockup's wordmark is unreadable
         at 16px). `apple-touch-icon` is flattened onto the theme colour because
         iOS composites transparent icons over black. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The browser chrome follows the theme the reader actually picked, which
         the script below has already applied to <html> by this point. A single
         light value left the address bar white behind a dark page. -->
    <meta name="theme-color" content="#eef2f9" data-theme-color />

    <!-- Theme, before first paint.
         The class is applied by React on mount, which is after the bundle has
         downloaded, parsed and rendered — so a reader who chose the dark theme
         got a full flash of the light one on every navigation. This reads the
         same key `src/utils/storage.ts` writes and settles it inline. Kept
         tiny and dependency-free on purpose: it blocks the parser. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('botagedrez.v1.settings');
          var dark = raw && JSON.parse(raw).theme === 'dark';
          document.documentElement.classList.toggle('dark', !!dark);
          var meta = document.querySelector('meta[data-theme-color]');
          if (meta && dark) meta.setAttribute('content', '#0c0f1d');
        } catch (e) {
          /* private mode, blocked storage: fall through to the light default */
        }
      })();
    </script>

    <!-- Installable app. iOS ignores the manifest's name and display mode, so
         the `apple-mobile-web-app-*` pair repeats them for the home screen. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="botAgedrez" />
    <meta name="apple-mobile-web-app-title" content="botAgedrez" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    />
    <title>botAgedrez · Ajedrez online gratis con IA</title>
    <!-- No `keywords` meta. No major engine has read one for well over a
         decade, and the prerenderer copies the template's head to all 105
         pages — so the Japanese, Arabic and Russian trees were each shipping
         the same Spanish keyword list. -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="botAgedrez" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://botagedrez.codezun.com/" />

    <!-- Structured data.
         The `WebSite` node is what makes Google label the result "botAgedrez"
         instead of falling back to the registrable domain (codezun.com): the
         site name is read from the `WebSite` on the home page, and without one
         Search picks the parent domain and shows every subdomain under it.
         `url` must be this subdomain's root for the name to apply here only.
         The prerenderer swaps this block per page — see scripts/prerender.mjs. -->
    <script type="application/ld+json" data-seo-jsonld>
      [
        {
          "@context": "https://schema.org",

          "inLanguage": ["es", "en", "pt", "fr", "de", "ru", "hi", "zh", "ja", "ar"],
          "publisher": { "@id": "https://botagedrez.codezun.com/#organization" }
        },

          "inLanguage": ["es", "en", "pt", "fr", "de", "ru", "hi", "zh", "ja", "ar"],

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Social bar / pop. A document-level unit that manages its own placement,
         so it belongs to the document rather than to any React route: loading it
         here means it runs once per visit on every prerendered page, instead of
         being torn down and re-armed on each client-side navigation. `async` so
         it never blocks the app bundle. -->
    <script
      async
      data-cfasync="false"
      src="https://pl31073503.profitableratecpmnetwork.com/81/4a/59/814a59c7bceb52fd9a0e164460d98b84.js"
    ></script>

    <!-- Second document-level unit. Same shape as the bar above — it places
         itself and has to run once per visit rather than once per route — but
         it is injected instead of written inline, and only after `load` and on
         the first idle frame. Two parsed <script async> tags in the body both
         go out during boot and share the main thread with the engine while the
         reader is still waiting on the board; deferring this one keeps the
         first paint and the first move exactly as fast as they are today, and
         the unit itself loses nothing by arriving a second later.
         `requestIdleCallback` is absent on Safari < 16.4, hence the timer. -->
    <script>
      (function () {
        var SRC =
          'https://pl31475973.profitableratecpmnetwork.com/f7/12/2d/f7122dce2908d4049cf8a23b83765b74.js';
        function inject() {
          var s = document.createElement('script');
          s.async = true;
          s.setAttribute('data-cfasync', 'false');
          s.src = SRC;
          document.body.appendChild(s);
        }
        function whenIdle() {
          if (typeof requestIdleCallback === 'function') {
            requestIdleCallback(inject, { timeout: 5000 });
          } else {
            setTimeout(inject, 2500);
          }
        }
        if (document.readyState === 'complete') whenIdle();
        else addEventListener('load', whenIdle, { once: true });
      })();
    </script>
  </body>
